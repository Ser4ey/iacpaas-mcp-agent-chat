[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iacpaas-materials-chat"
version = "0.1.0"
description = "Локальный чат с базами материалов IACPaaS через MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "mcp>=1.20,<2",
  "pydantic-settings>=2.7,<3",
  "langchain>=1.4,<2",
  "langchain-openai>=1.7,<2",
  "langchain-mcp-adapters>=0.3.2,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
materials-chat = "materials_chat.__main__:main"

[tool.setuptools.packages.find]
include = ["materials_chat*"]

[tool.setuptools.package-data]
materials_chat = ["static/*", "defaults/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

