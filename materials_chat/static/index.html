<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Материалы · IACPaaS</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
  <!-- Всё локально: ни шрифтов, ни скриптов с внешних адресов. -->
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div class="app">

    <!-- Список диалогов. На узком экране — выезжающая панель. -->
    <aside class="sidebar" id="sidebar" aria-label="Диалоги">
      <div class="sidebar-head">
        <a class="wordmark" href="#chat">Материалы <span>IACPaaS</span></a>
        <button class="icon-button sidebar-close" id="close-sidebar" type="button" aria-label="Закрыть список диалогов">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <button class="new-chat" id="new-chat" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        Новый диалог
      </button>
      <nav class="session-list" id="session-list" aria-label="История диалогов"></nav>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="open-sidebar" type="button"
                aria-label="Открыть список диалогов" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
        </button>
        <nav class="views" aria-label="Разделы">
          <a href="#chat" id="nav-chat">Диалоги</a>
          <a href="#data" id="nav-data">Данные</a>
        </nav>
        <!-- Индикатор: модель, заполнение контекста, стоимость диалога. -->
        <div class="meter" id="meter">
          <span class="meter-model" id="meter-model"></span>
          <!-- Индикатор контекста открывает панель «Что видит модель». -->
          <button class="meter-context" id="meter-context" type="button" aria-haspopup="dialog" hidden>
            <span class="meter-bar" aria-hidden="true"><span id="meter-fill"></span></span>
            <span id="meter-context-text"></span>
          </button>
          <span class="meter-cost" id="meter-cost" hidden></span>
        </div>
      </header>

      <!-- Уведомления появляются только когда действительно нужны. -->
      <div class="notice" id="setup-notice" role="status" hidden></div>
      <div class="notice" id="index-notice" role="status" hidden></div>
      <div class="notice notice-error" id="error-notice" role="alert" hidden>
        <span id="error-text"></span>
        <button class="link-button" id="dismiss-error" type="button">Закрыть</button>
      </div>

      <!-- Раздел «Диалоги» -->
      <section class="view" id="view-chat" aria-labelledby="chat-heading">
        <div class="scroll" id="conversation">
          <div class="column">
            <h1 class="visually-hidden" id="chat-heading">Диалог</h1>
            <div class="intro" id="intro" hidden>
              <p class="intro-text">Ассистент ищет ответы в базе материалов IACPaaS: марки сплавов, химический состав, свойства и единицы измерения.</p>
              <p class="intro-label">Например</p>
              <ul class="suggestions" id="suggestions"></ul>
              <p class="intro-more"><a href="#data">Какие данные доступны</a></p>
            </div>
            <div class="messages" id="messages" aria-live="polite" aria-relevant="additions"></div>
          </div>
        </div>
        <footer class="composer-area">
          <form class="composer column" id="chat-form">
            <label class="visually-hidden" for="message-input">Вопрос ассистенту</label>
            <textarea id="message-input" rows="1" maxlength="12000"
                      placeholder="Спросите о материале или свойстве"></textarea>
            <button class="send-button" id="send-button" type="submit" aria-label="Отправить" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>
            </button>
            <button class="stop-button" id="stop-button" type="button" hidden>Стоп</button>
          </form>
          <p class="composer-hint column">Enter — отправить, Shift+Enter — новая строка</p>
        </footer>
      </section>

      <!-- Раздел «Данные»: содержимое строит data-view.js -->
      <section class="view" id="view-data" aria-label="Данные" hidden>
        <div class="scroll">
          <div class="column" id="data-content"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- «Что видит модель»: что уйдёт в модель со следующим вопросом. Содержимое строит context-view.js -->
  <dialog class="context-dialog" id="context-dialog" aria-labelledby="context-title">
    <div class="context-head">
      <h2 id="context-title">Что видит модель</h2>
      <button class="icon-button" id="close-context" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="context-body" id="context-body"></div>
  </dialog>

  <!-- Иконка удаления для строк списка диалогов (клонируется из JS). -->
  <template id="icon-delete">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
  </template>
</body>
</html>
